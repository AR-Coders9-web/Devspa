<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Affinity Analyzer 💕</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400&display=swap');
        
        :root {
            --bg-color: #4a0e2e;
            --primary-color: #6d1b3f;
            --secondary-color: #892b52;
            --accent-color: #ff8fab;
            --text-color: #fce4ec;
            --glow-color: rgba(255, 143, 171, 0.7);
        }

        /* Loading Screen Styles */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .heart-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 40px;
        }
        
        .heart {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--accent-color);
            transform: rotate(45deg);
            animation: heartbeat 1.2s infinite;
            box-shadow: 0 0 40px var(--accent-color);
        }
        
        .heart:before,
        .heart:after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 50%;
        }
        
        .heart:before {
            top: -50%;
            left: 0;
        }
        
        .heart:after {
            top: 0;
            left: -50%;
        }
        
        @keyframes heartbeat {
            0% { transform: rotate(45deg) scale(0.8); }
            5% { transform: rotate(45deg) scale(0.9); }
            10% { transform: rotate(45deg) scale(0.8); }
            15% { transform: rotate(45deg) scale(1); }
            50% { transform: rotate(45deg) scale(0.8); }
            100% { transform: rotate(45deg) scale(0.8); }
        }
        
        .particle {
            position: absolute;
            background-color: var(--accent-color);
            border-radius: 50%;
            opacity: 0;
        }
        
        @keyframes burst {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* UI Loading Animation */
        .ui-loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .loading-text {
            font-family: 'Playfair Display ', serif;
            color: var(--text-color);
            font-size: 1.5remsdfsdf;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--glow-color);
        }

        .loading-dots {
            display: flex;
            gap: 10dfsfpx;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--accent-color);
            animation: dot-pulse 1.5s infinite ease-in-out;
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dot-pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .progress-container {
            width: 250px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-loading {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-color), #ffadd2);
            border-radius: 10px;
            animation: loading-progress 2.5s ease-in-out forwards;
        }

        @keyframes loading-progress {
            0% { width: 0%; }
            20% { width: 25%; }
            40% { width: 50%; }
            60% { width: 75%; }
            80% { width: 90%; }
            100% { width: 100%; }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-color), var(--primary-color));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-color);
            cursor: none;
            opacity: 0;
            animation: fadeIn 1s ease-in-out forwards;
            animation-delay: 3s;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .container {
            position: relative;
            z-index: 1;
            background: rgba(109, 27, 63, 0.5);
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }
        
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--glow-color), 0 0 20px var(--glow-color);
        }
        
        .subtitle {
            font-size: 0.9rem;
            margin-bottom: 25px;
            font-weight: 300;
        }
        
        .input-field {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid var(--secondary-color);
            border-radius: 50px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-color);
            margin-bottom: 15px;
        }
        
        .input-field:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--glow-color);
        }
        
        .action-btn {
            background: linear-gradient(45deg, var(--accent-color), #ff5c8a);
            color: var(--bg-color);
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            margin-top: 10px;
        }
        
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 143, 171, 0.4);
        }

        /* --- UI Sections --- */
        .ui-section { display: none; }
        .ui-section.active { display: block; animation: fadeIn 0.5s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Quiz Section */
        #quiz-container { text-align: left; }
        .question { font-size: 1.2rem; margin-bottom: 20px; text-align: center;}
        .answers { display: flex; flex-direction: column; gap: 10px; }
        .answer-btn {
            background: var(--primary-color);
            color: var(--text-color);
            border: 1px solid var(--secondary-color);
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            text-align: left;
            cursor: none;
            transition: background 0.2s, border-color 0.2s;
        }
        .answer-btn:hover {
            background: var(--secondary-color);
            border-color: var(--accent-color);
        }

        /* Analysis Section */
        .analysis-text { font-family: 'Playfair Display', serif; font-size: 1.8rem; }
        .progress-bar { width: 100%; height: 10px; background: rgba(0,0,0,0.3); border-radius: 5px; margin-top: 15px; overflow: hidden; }
        .progress-bar-inner { width: 0; height: 100%; background: linear-gradient(90deg, var(--accent-color), #ffaddd); border-radius: 5px; animation: loading 2.5s ease-in-out forwards; }
        @keyframes loading { from { width: 0%; } to { width: 100%; } }

        /* Result Section */
        .result-percentage { font-family: 'Playfair Display', serif; font-size: 4.5rem; color: #fff; text-shadow: 0 0 25px var(--glow-color); }
        .result-message { font-size: 1.1rem; min-height: 40px; }

        /* --- Custom Animated Cursor --- */
        .cursor-dot, .cursor-ring {
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
        }
        .cursor-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            transition: transform 0.1s ease-out;
        }
        .cursor-ring {
            width: 40px;
            height: 40px;
            border: 2px solid var(--accent-color);
            transition: transform 0.2s ease-out, width 0.3s, height 0.3s, opacity 0.3s;
        }
        .cursor-ring.hovered {
            width: 60px;
            height: 60px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="heart-container">
            <div class="heart" id="heart"></div>
        </div>
        
        <div class="ui-loading-container">
            <div class="loading-text">Initializing Love Connection</div>
            
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar-loading"></div>
            </div>
        </div>
    </div>

    <div class="cursor-ring"></div>
    <div class="cursor-dot"></div>

    <canvas id="particle-canvas"></canvas>

    <div class="container">
        <div id="name-container" class="ui-section active">
            <h1 class="title">LOVE Calculator</h1>
            <p class="subtitle">Begin by entering two names to establish a foundational bond.</p>
            <input type="text" class="input-field" id="name1" placeholder="First Name">
            <input type="text" class="input-field" id="name2" placeholder="Second Name">
            <button class="action-btn" id="start-btn">Begin Analysis</button>
        </div>

        <div id="quiz-container" class="ui-section">
            <p class="subtitle">Answer these questions to measure your personal connection.</p>
            <h2 id="question-text" class="question"></h2>
            <div id="answers-box" class="answers"></div>
        </div>

        <div id="analysis-container" class="ui-section">
            <h2 class="analysis-text">Analyzing Your Connection...</h2>
            <p class="subtitle">Combining foundational and personal energies.</p>
            <div class="progress-bar"><div class="progress-bar-inner"></div></div>
        </div>

        <div id="result-container" class="ui-section">
            <p class="subtitle">Final Affinity Score:</p>
            <h1 id="percentage" class="result-percentage">0%</h1>
            <p id="message" class="result-message"></p>
            <button id="restart-btn" class="action-btn">Analyze Another</button>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Loading screen animation
        const loadingScreen = document.getElementById('loading-screen');
        const heart = document.getElementById('heart');
        const loadingText = document.querySelector('.loading-text');
        const texts = [
            "Initializing Love Connection",
            "Calculating Romantic Potential",
            "Analyzing Compatibility Matrices",
            "Preparing Love Algorithm"
        ];
        
        let textIndex = 0;
        
        // Change text every second
        const textInterval = setInterval(() => {
            textIndex = (textIndex + 1) % texts.length;
            loadingText.textContent = texts[textIndex];
        }, 1000);
        
        // Create heart burst effect after 2.5 seconds
        setTimeout(() => {
            clearInterval(textInterval);
            loadingText.textContent = "Connection Established!";
            
            // Stop the heartbeat animation
            heart.style.animation = 'none';
            
            // Create burst particles
            createBurstParticles();
            
            // Fade out the loading screen
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 500);
            }, 800);
        }, 2500);
        
        function createBurstParticles() {
            const heartContainer = document.querySelector('.heart-container');
            const particlesCount = 30;
            
            for (let i = 0; i < particlesCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random size, position and animation delay
                const size = Math.random() * 15 + 5;
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 60 + 40;
                const delay = Math.random() * 300;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.background = getRandomParticleColor();
                particle.style.animation = `burst 0.8s ease-out ${delay}ms forwards`;
                
                // Calculate final position
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                
                particle.style.transform = `translate(${x}px, ${y}px)`;
                
                heartContainer.appendChild(particle);
            }
            
            // Hide the original heart
            heart.style.opacity = '0';
        }
        
        function getRandomParticleColor() {
            const colors = [
                '#ff8fab', '#ff5c8a', '#ffadd2', '#ff85a2', 
                '#f72585', '#f784b8', '#ff97b7', '#ff7096'
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // --- Romantic Particle background ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim();

        function createParticles() {
            particles = [];
            let particleCount = (canvas.height * canvas.width) / 10000;
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: Math.random() * 0.4 - 0.2,
                    vy: Math.random() * 0.4 - 0.2,
                    radius: Math.random() * 2 + 1,
                    alpha: Math.random() * 0.5 + 0.3
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 143, 171, ${p.alpha})`;
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        createParticles();
        animateParticles();

        // --- Animated Cursor Logic ---
        const cursorRing = document.querySelector('.cursor-ring');
        const cursorDot = document.querySelector('.cursor-dot');
        let mouseX = -100, mouseY = -100;
        let ringX = -100, ringY = -100;
        let dotX = -100, dotY = -100;

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        const followMouse = () => {
            ringX += (mouseX - ringX) * 0.1;
            ringY += (mouseY - ringY) * 0.1;
            dotX += (mouseX - dotX) * 0.3;
            dotY += (mouseY - dotY) * 0.3;

            cursorRing.style.transform = `translate(${ringX-20}px, ${ringY-20}px)`;
            cursorDot.style.transform = `translate(${dotX-4}px, ${dotY-4}px)`;

            requestAnimationFrame(followMouse);
        };
        followMouse();

        document.querySelectorAll('button, input, .answer-btn').forEach(el => {
            el.addEventListener('mouseenter', () => cursorRing.classList.add('hovered'));
            el.addEventListener('mouseleave', () => cursorRing.classList.remove('hovered'));
        });

        // --- Application Logic ---
        const sections = {
            name: document.getElementById('name-container'),
            quiz: document.getElementById('quiz-container'),
            analysis: document.getElementById('analysis-container'),
            result: document.getElementById('result-container')
        };
        const name1Input = document.getElementById('name1');
        const name2Input = document.getElementById('name2');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        let name1, name2, quizScore = 0, currentQuestionIndex = 0;

        const quizQuestions = [
            {
                question: "How often do you make each other laugh?",
                answers: [ { text: "Constantly, we share the same humor!", value: 40 }, { text: "Quite often.", value: 25 }, { text: "Sometimes.", value: 10 } ]
            },
            {
                question: "When facing a challenge, you...",
                answers: [ { text: "Tackle it together as a perfect team.", value: 40 }, { text: "Support each other from the sidelines.", value: 25 }, { text: "Usually handle things separately.", value: 10 } ]
            },
            {
                question: "A perfect evening for you both is...",
                answers: [ { text: "A quiet, cozy night in, just the two of us.", value: 20 }, { text: "Exploring somewhere new and exciting.", value: 20 }, { text: "Doesn't matter, as long as we're together.", value: 40 } ]
            }
        ];

        function switchSection(sectionName) {
            Object.values(sections).forEach(sec => sec.classList.remove('active'));
            sections[sectionName].classList.add('active');
        }
        
        function calculateNameCompatibility(n1, n2) {
            const clean1 = n1.toLowerCase().replace(/[^a-z]/g, '');
            const clean2 = n2.toLowerCase().replace(/[^a-z]/g, '');
            if (!clean1 || !clean2) return 30;
            let value = 0;
            for (let i = 0; i < (clean1 + clean2).length; i++) {
                value = (value + (clean1+clean2).charCodeAt(i) * (i + 1)) % 101;
            }
            return Math.floor(value / 100 * 30) + 40;
        }

        function displayQuestion() {
            const questionData = quizQuestions[currentQuestionIndex];
            document.getElementById('question-text').textContent = questionData.question;
            const answersBox = document.getElementById('answers-box');
            answersBox.innerHTML = '';
            questionData.answers.forEach(answer => {
                const button = document.createElement('button');
                button.textContent = answer.text;
                button.className = 'answer-btn';
                button.onclick = () => selectAnswer(answer.value);
                answersBox.appendChild(button);
            });
        }

        function selectAnswer(value) {
            quizScore += value;
            currentQuestionIndex++;
            if (currentQuestionIndex < quizQuestions.length) {
                displayQuestion();
            } else {
                startFinalAnalysis();
            }
        }
        
        function startFinalAnalysis() {
            switchSection('analysis');
            setTimeout(() => {
                const nameScore = calculateNameCompatibility(name1, name2);
                const normalizedQuizScore = (quizScore / 120) * 100;
                let finalScore = Math.round((nameScore * 0.4) + (normalizedQuizScore * 0.6));
                finalScore = Math.max(50, Math.min(99, finalScore));
                displayResult(finalScore);
            }, 2500);
        }

        function getResultMessage(p) {
            if (p >= 95) return "A cosmic convergence! Your bond is truly rare and powerful.";
            if (p >= 85) return "An exceptional synergy. You elevate each other in remarkable ways.";
            if (p >= 75) return "A deep and meaningful connection, built on shared joy and support.";
            if (p >= 60) return "A strong and promising affinity with wonderful potential.";
            return "A sweet connection with a foundation worth building upon.";
        }

        function displayResult(score) {
            document.getElementById('percentage').textContent = score + '%';
            document.getElementById('message').textContent = getResultMessage(score);
            switchSection('result');
        }

        startBtn.addEventListener('click', () => {
            name1 = name1Input.value.trim();
            name2 = name2Input.value.trim();
            if (!name1 || !name2) {
                alert('Please enter both names to begin.');
                return;
            }
            switchSection('quiz');
            displayQuestion();
        });

        restartBtn.addEventListener('click', () => {
            name1Input.value = '';
            name2Input.value = '';
            quizScore = 0;
            currentQuestionIndex = 0;
            switchSection('name');
        });
    });
    </script>
</body>
</html>
